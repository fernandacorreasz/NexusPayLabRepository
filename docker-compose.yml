services:
  db:
    image: postgres:12-alpine
    environment:
      POSTGRES_DB: nexuspay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nexuspay_postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nexuspay_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexuspay"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/nexuspay
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: nexuspay_postgres
      NEXUS_FIRMWARE_URL: http://notifications:8090
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      notifications:
        condition: service_started
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
  notifications:
    build: ./notifications
    ports:
      - "127.0.0.1:8090:8090"
volumes:
  nexuspay_db:
