spring.application.name=nexuspay-api
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nexuspay}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:nexuspay_postgres}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jackson.serialization.write-dates-as-timestamps=false
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs
logging.level.com.nexuspay=INFO
nexus.firmware.url=${NEXUS_FIRMWARE_URL:http://localhost:8090}
